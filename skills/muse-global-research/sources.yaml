rsshub_routes:
  # Patterns only. Every route must pass a live test in the round it is used.
  # The official instance is rsshub.app; alternate/self-hosted instances are the first fallback.
  - name: "RSSHub Bilibili popular"
    tier: B
    kind: rsshub
    route: "rsshub.app/bilibili/popular/all"
    use_for: ["B站热门", "爆款视频"]
    fallback: "Bilibili popular page via browser"
  - name: "RSSHub Bilibili user video"
    tier: B
    kind: rsshub
    route: "rsshub.app/bilibili/user/video/:uid"
    use_for: ["对标账号追踪"]
    fallback: "Bilibili user page via browser"
  - name: "RSSHub Bilibili user dynamic"
    tier: B
    kind: rsshub
    route: "rsshub.app/bilibili/user/dynamic/:uid"
    use_for: ["对标账号追踪"]
    fallback: "Bilibili user page via browser"
  - name: "RSSHub Weibo hot search"
    tier: B
    kind: rsshub
    route: "rsshub.app/weibo/search/hot"
    use_for: ["微博热搜"]
    fallback: "Weibo hot search page via browser"
  - name: "RSSHub Juejin category"
    tier: B
    kind: rsshub
    route: "rsshub.app/juejin/category/:category"
    use_for: ["开发者内容"]
    fallback: "Juejin category page"
  - name: "RSSHub Zhihu hotlist"
    tier: C
    kind: rsshub
    route: "rsshub.app/zhihu/hotlist"
    use_for: []
    fallback: "Current Zhihu route in latest RSSHub docs (live-test first) or Zhihu hot page via browser"
    notes: "CONFIRMED DEAD 2026-10-29: text fetch 403; browser check loaded rsshub.app but the route returned NotFoundError: route does not exist or has been deleted, no feed items. Removed from routine use."

no_stable_rss:
  - "微信公众号（多数）: use RSSHub WeChat route only after a live test, else account page / search"
  - "小红书: no stable official RSS; use search / browser, never invent a feed URL"
  - "抖音单账号 / 抖音热榜: use platform hot-list archives or page via browser, not an invented RSS URL"
  - "B站单账号: prefer RSSHub user routes above after a live test, else the user page"

platform_pages_not_rss:
  - name: "Bilibili popular rank"
    url: "https://www.bilibili.com/v/popular/rank/all"
    note: "Ranking page, not RSS. Do not cite it as an RSS source."
  - name: "GitHub Trending"
    url: "https://github.com/trending"
    note: "Use for developer-tool heat; verify via repo pages."
