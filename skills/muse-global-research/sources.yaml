# Muse Global Research — tiered sources
# How to read this file:
#   tier A = verified live on 2026-10-29 (XML returned, items fresh that day)
#   tier B = documented address, NOT verified item-by-item on 2026-10-29; test one item before citing
#   tier C = confirmed dead/unusable on 2026-10-29; do NOT use as a default, use fallback
#   tier D = no stable RSS; use the platform page / search / browser, never invent a feed URL
# Rules: a tier B URL is not "verified". A tier C source stays out of the routine list
# until a fresh live test passes. After two consecutive failed weekly checks, demote A/B to "under repair".
version: 1
verified_on: "2026-10-29"
maintainer_note: "For Muse. Re-run scripts/check_feeds.py weekly; update verified_on and tier on every change."

overseas:
  - name: "Hacker News"
    tier: A
    kind: rss
    url: "https://news.ycombinator.com/rss"
    use_for: ["tech", "startups", "AI tools"]
    fallback: "https://hnrss.org/frontpage?points=100&count=20"
    notes: "2026-10-29 fetch returned XML, items mostly 2026-10-28, with comment links."
  - name: "TechCrunch"
    tier: A
    kind: rss
    url: "https://techcrunch.com/feed/"
    use_for: ["startups", "funding", "tech news"]
    fallback: "TechCrunch site search / browser"
    notes: "2026-10-29 fetch returned XML, latest item 2026-10-28 23:58 UTC."
  - name: "Hacker News (filtered, hnrss)"
    tier: B
    kind: rss
    url: "https://hnrss.org/frontpage?points=100&count=20"
    use_for: ["tech", "startups"]
    fallback: "https://news.ycombinator.com/rss"
    notes: "Noise filter: only 100+ point posts. Flaky on 2026-10-29: first check returned 502, second check same day returned XML with 15 items. Keep as Tier B (test before use)."
  - name: "The Verge"
    tier: A
    kind: rss
    url: "https://www.theverge.com/rss/index.xml"
    use_for: ["tech", "culture"]
    fallback: "The Verge site search"
    notes: "Promoted to Tier A after 2026-10-29 check: XML, 10 items, newest 2026-10-28."
  - name: "Ars Technica"
    tier: A
    kind: rss
    url: "https://feeds.arstechnica.com/arstechnica/index"
    use_for: ["tech", "science"]
    fallback: "Ars Technica site search"
    notes: "Promoted to Tier A after 2026-10-29 check: XML, 20 items, newest 2026-10-28."
  - name: "Wired"
    tier: A
    kind: rss
    url: "https://www.wired.com/feed/rss"
    use_for: ["tech", "culture"]
    fallback: "Wired site search"
    notes: "Promoted to Tier A after 2026-10-29 check: XML, 50 items, newest 2026-10-28."
  - name: "MIT Technology Review (top news)"
    tier: A
    kind: rss
    url: "https://www.technologyreview.com/topnews.rss"
    use_for: ["AI", "frontier tech"]
    fallback: "MIT Technology Review site search"
    notes: "Promoted to Tier A after 2026-10-29 check: XML, 10 items, newest 2026-10-28."
  - name: "Techmeme"
    tier: A
    kind: rss
    url: "https://www.techmeme.com/feed.xml"
    use_for: ["tech news aggregation"]
    fallback: "Techmeme site"
    notes: "Promoted to Tier A after 2026-10-29 check: XML, 15 items, newest 2026-10-28."
  - name: "GitHub Blog"
    tier: A
    kind: rss
    url: "https://github.blog/feed/"
    use_for: ["developer tools", "open source"]
    fallback: "GitHub Trending page / search"
    notes: "Promoted to Tier A after 2026-10-29 check: XML, 10 items, newest 2026-10-28."
  - name: "Reddit (per-subreddit)"
    tier: B
    kind: rss
    url_pattern: "https://www.reddit.com/r/<subreddit>/.rss"
    examples: ["startups", "Entrepreneur", "artificial"]
    use_for: ["community signal", "pain points"]
    fallback: "Subreddit page via browser"
    notes: "Public posts only; respect subreddit rules."

